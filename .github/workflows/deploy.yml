name: Déployer la bêta

# Déclenché quand Jack fusionne une Pull Request dans main.
# Tests -> build tamponné avec le commit -> publication GitHub Pages.
# La PWA installée sur le téléphone se met ensuite à jour toute seule.
#
# Même schéma que les jeux existants (ex. rupture-v0/deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build.js "$GITHUB_SHA"
      - name: Version publiée
        run: |
          echo "### Bêta publiée : $(cat dist/version.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
